    <style>
      /* Editorial emphasis: make the scale of the network the first visual fact. */
      .site-shell {
        background:
          radial-gradient(circle at 88% 4%, rgba(123, 63, 145, .16), transparent 28%),
          radial-gradient(circle at 8% 22%, rgba(233, 105, 163, .10), transparent 24%),
          var(--paper);
      }

      .topbar {
        display: grid;
        grid-template-columns: 70px minmax(280px, 1fr) minmax(390px, auto);
        min-height: 148px;
        gap: 22px;
        border-bottom: 0;
        padding: 20px 0 18px;
      }

      .brand-logo {
        width: 62px;
        height: 62px;
      }

      .topbar h1 {
        max-width: 680px;
        color: var(--wine);
        font-size: clamp(32px, 4.2vw, 56px);
        line-height: .98;
        letter-spacing: -.055em;
      }

      .dataset-count {
        display: flex !important;
        position: relative;
        align-items: stretch;
        gap: 0;
        min-width: 390px;
        margin-left: auto;
        padding: 30px 22px 17px;
        border: 1px solid rgba(123, 63, 145, .20);
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(255,255,255,.94), rgba(255,242,250,.82));
        box-shadow: 0 16px 40px rgba(123, 63, 145, .12);
      }

      .dataset-count::before {
        content: "ΜΕΓΕΘΟΣ ΔΙΚΤΥΟΥ";
        position: absolute;
        top: 11px;
        left: 22px;
        color: #9b6e70;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .15em;
      }

      .network-stat {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: end;
        gap: 7px;
        flex: 1;
      }

      .network-stat strong {
        color: var(--wine);
        font-size: clamp(30px, 3vw, 42px);
        line-height: .86;
        letter-spacing: -.055em;
      }

      .network-stat span {
        max-width: 102px;
        color: #765e63;
        font-size: 10px;
        font-weight: 750;
        line-height: 1.15;
        text-transform: uppercase;
        letter-spacing: .06em;
      }

      .stat-divider {
        width: 1px;
        margin: 0 18px;
        background: rgba(123, 63, 145, .16);
      }

      .intro-row {
        min-height: 118px;
        padding: 14px 0 22px;
        border-top: 1px solid rgba(123, 63, 145, .10);
      }

      .intro-row > p {
        max-width: 900px;
        color: #665257;
        font-size: 15px;
        line-height: 1.62;
      }

      .explorer {
        min-height: 650px;
        box-shadow: 0 24px 72px rgba(123, 63, 145, .14);
      }

      .graph-panel::before {
        content: "70 ΛΟΓΑΡΙΑΣΜΟΙ  ·  894 ΣΧΕΣΕΙΣ";
        position: absolute;
        z-index: 2;
        top: 17px;
        left: 17px;
        padding: 9px 12px;
        border: 1px solid rgba(255,255,255,.32);
        border-radius: 999px;
        background: rgba(123, 63, 145, .92);
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .10em;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(123, 63, 145, .20);
      }

      .empty-detail h2 {
        color: var(--wine);
        font-size: 17px;
      }

      .empty-detail p {
        max-width: 220px;
        font-size: 11px;
      }

      @media (max-width: 1050px) {
        .topbar {
          grid-template-columns: 62px minmax(230px, 1fr);
          min-height: 0;
        }

        .dataset-count {
          grid-column: 1 / -1;
          width: 100%;
          min-width: 0;
          margin: 0;
        }

        .intro-row {
          padding: 18px 0;
        }
      }

      @media (max-width: 620px) {
        .topbar {
          grid-template-columns: 48px 1fr;
          gap: 12px;
          padding-top: 16px;
        }

        .brand-logo {
          width: 46px;
          height: 46px;
        }

        .topbar h1 {
          font-size: 30px;
          line-height: 1.02;
        }

        .dataset-count {
          padding: 29px 15px 15px;
        }

        .dataset-count::before {
          left: 15px;
        }

        .network-stat {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .network-stat strong {
          font-size: 34px;
        }

        .stat-divider {
          margin: 0 12px;
        }

        .intro-row > p {
          font-size: 14px;
        }

        .graph-panel::before {
          top: 11px;
          left: 11px;
          font-size: 8px;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const updateCopy = () => {
          const renderedTitle = document.querySelector(".topbar h1");
          if (!renderedTitle) return false;

          document.title = "Το δίκτυο των 70 λογαριασμών";

          renderedTitle.textContent = "Το δίκτυο των 70 λογαριασμών";

          const metrics = document.querySelector(".dataset-count");
          if (metrics) {
            metrics.setAttribute("aria-label", "Μέγεθος δικτύου: 70 λογαριασμοί και 894 σχέσεις ακολούθησης");
            metrics.innerHTML = `
              <span class="network-stat"><strong>70</strong><span>λογαριασμοί</span></span>
              <i class="stat-divider" aria-hidden="true"></i>
              <span class="network-stat"><strong>894</strong><span>σχέσεις ακολούθησης</span></span>
            `;
          }

          const intro = document.querySelector(".intro-row > p");
          if (intro) {
            intro.textContent = "Η χαρτογράφηση αποκαλύπτει ένα εκτεταμένο πλέγμα μεταξύ των 70 εξεταζόμενων λογαριασμών: καταγράφηκαν 894 δημόσια ορατές σχέσεις ακολούθησης. Κάθε κόμβος αντιστοιχεί σε έναν λογαριασμό και το μέγεθός του αυξάνεται ανάλογα με τις συνδέσεις του μέσα στο δίκτυο.";
          }

          const emptyTitle = document.querySelector(".empty-detail h2");
          if (emptyTitle) emptyTitle.textContent = "Εξερεύνησε τις 894 σχέσεις";

          const emptyText = document.querySelector(".empty-detail p");
          if (emptyText) {
            emptyText.textContent = "Πέρασε τον δείκτη πάνω από έναν κόμβο για να απομονώσεις τις άμεσες συνδέσεις του ή επίλεξέ τον για αναλυτικά στοιχεία.";
          }

          const toggleButtons = document.querySelectorAll(".label-toggle button");
          if (toggleButtons[0]) toggleButtons[0].textContent = "Όλα τα ονόματα";
          if (toggleButtons[1]) toggleButtons[1].textContent = "Μόνο το επιλεγμένο";

          const footerNotes = document.querySelectorAll("footer p");
          if (footerNotes[0]) {
            footerNotes[0].textContent = "Πηγή: 894 δημόσια ορατές σχέσεις ακολούθησης μεταξύ των 70 λογαριασμών που εξετάστηκαν στην έρευνα.";
          }

          return true;
        };

        if (!updateCopy()) {
          const root = document.getElementById("root");
          const observer = new MutationObserver(() => {
            if (updateCopy()) observer.disconnect();
          });

          if (root) observer.observe(root, { childList: true, subtree: true });
        }
      })();
    </script>
